name: Deploy to AKS

on:
  push:
    branches:
      - main

env:
  AZURE_REGION: eastus
  RESOURCE_GROUP: my-aks-resource-group
  CLUSTER_NAME: my-aks-cluster
  HELM_RELEASE_NAME: my-app
  DOCKER_IMAGE: javeriyasdocker/aksdemo:latest

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Manual - For Debugging Only)
        if: true  # Change this to false in production
        run: az login --use-device-code

      # - name: Azure Login (Service Principal)
      #   if: env.AZURE_CLIENT_ID != ''
      #   uses: azure/login@v1
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #     auth-type: SERVICE_PRINCIPAL

      # - name: Azure Login (OIDC - If Federated Identity is Set Up)
      #   if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
      #   uses: azure/login@v1
      #   with:
      #     client-id: ${{ secrets.AZURE_CLIENT_ID }}
      #     tenant-id: ${{ secrets.AZURE_TENANT_ID }}
      #     subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      #     auth-type: OIDC
          
      - name: Set Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: login
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7  # Specify the Terraform version you need

      - name: Verify Terraform Installation
        run: terraform version

      # - name: Initialize Terraform
      #   run: terraform init

      # - name: Apply Terraform Configuration
      #   run: terraform apply -auto-approve
        
      - name: Initialize & Apply Terraform
        run: |
          cd terraform
          terraform init
          terraform apply -auto-approve

