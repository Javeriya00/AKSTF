name: Deploy to AKS

on:
  push:
    branches:
      - main

env:
  AZURE_REGION: eastus
  RESOURCE_GROUP: my-aks-resource-group
  CLUSTER_NAME: my-aks-cluster
  HELM_RELEASE_NAME: my-app
  DOCKER_IMAGE: javeriyasdocker/aksdemo:latest

jobs:
  login:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login (Manual - For Debugging Only)
        if: true  # Change to true if you want manual login
        run: az login --use-device-code

      - name: Azure Login (Service Principal)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: SERVICE_PRINCIPAL

      - name: Azure Login (OIDC - If Federated Identity is Set Up)
        if: env.AZURE_CLIENT_ID != '' && env.AZURE_TENANT_ID != '' && env.AZURE_SUBSCRIPTION_ID != ''
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: OIDC
          
      - name: Set Subscription
        run: az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}

  deploy:
    needs: login
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Terraform
        run: |
          sudo apt-get update && sudo apt-get install -y unzip curl
          curl -L -o terraform.zip https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip
          ls -lah terraform.zip  # Check if the file was downloaded
          unzip terraform.zip || (echo "Failed to unzip. File may be corrupt." && exit 1)
          sudo mv terraform /usr/local/bin/
          terraform --version  # Verify installation
# - name: Install Terraform
#         run: |
#           sudo apt-get update && sudo apt-get install -y unzip
#           curl -fsSL https://releases.hashicorp.com/terraform/1.5.7/terraform_1.5.7_linux_amd64.zip -o terraform.zip
#           unzip terraform.zip && sudo mv terraform /usr/local/bin/

      - name: Initialize Terraform
        run: terraform init

      - name: Apply Terraform Configuration
        run: terraform apply -auto-approve
